<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PajarraCO - Tienda de Stickers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" class="logo">
                <img src="logos.png" alt="Logo Pajarraco" class="logo-img">
                PajarraCO
            </a>
            <div class="cart-icon" id="cartIcon">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Bienvenido a Pajarraco</h1>
            <p>La tienda de stickers más colorida y divertida 🎨</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="animales">Animales</button>
            <button class="filter-btn" data-filter="viajes">Viajes</button>
            <button class="filter-btn" data-filter="tech">Tech</button>
            <button class="filter-btn" data-filter="comida">Comida</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargarán aquí con JavaScript -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PajarraCO - Tienda de Stickers. Todos los derechos reservados. Cony y Robert</p>
    </footer>

    <!-- Modal del Carrito -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Carrito</h2>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div id="cartItems"></div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío:</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Finalizar Compra</button>
        </div>
    </div>

    <script>
        // Base de datos de productos
        const products = [
            { id: 1, name: 'Sticker Loro Colorido', category: 'animales', price: 2.99, emoji: <img src="zorro.png" alt="zorro" class="logo-img"> },
            { id: 2, name: 'Sticker Avión', category: 'viajes', price: 2.49, emoji: '✈️' },
            { id: 3, name: 'Sticker Código', category: 'tech', price: 2.99, emoji: '💻' },
            { id: 4, name: 'Sticker Pizza', category: 'comida', price: 1.99, emoji: '🍕' },
            { id: 5, name: 'Sticker Gato', category: 'animales', price: 2.49, emoji: '🐱' },
            { id: 6, name: 'Sticker Mapa Mundi', category: 'viajes', price: 3.49, emoji: '🗺️' },
            { id: 7, name: 'Sticker Robot', category: 'tech', price: 3.99, emoji: '🤖' },
            { id: 8, name: 'Sticker Helado', category: 'comida', price: 2.49, emoji: '🍦' },
            { id: 9, name: 'Sticker Perro', category: 'animales', price: 2.49, emoji: '🐶' },
            { id: 10, name: 'Sticker Montaña', category: 'viajes', price: 2.99, emoji: '⛰️' },
            { id: 11, name: 'Sticker Teléfono', category: 'tech', price: 2.99, emoji: '📱' },
            { id: 12, name: 'Sticker Hamburguesa', category: 'comida', price: 2.49, emoji: '🍔' }
        ];

        let cart = [];
        let currentFilter = 'all';

        // Elementos del DOM
        const productsGrid = document.getElementById('productsGrid');
        const cartIcon = document.getElementById('cartIcon');
        const cartModal = document.getElementById('cartModal');
        const closeCartBtn = document.getElementById('closeCart');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // Inicializar la página
        function init() {
            renderProducts();
            setupEventListeners();
            loadCartFromStorage();
            updateCartCount();
        }

        // Renderizar productos
        function renderProducts() {
            const filteredProducts = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);

            productsGrid.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <div class="product-image">${product.emoji}</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-description">Diseño exclusivo</div>
                        <div class="product-footer">
                            <span class="price">$${product.price.toFixed(2)}</span>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Añadir</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Configurar event listeners
        function setupEventListeners() {
            cartIcon.addEventListener('click', openCart);
            closeCartBtn.addEventListener('click', closeCart);
            cartModal.addEventListener('click', (e) => {
                if (e.target === cartModal) closeCart();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderProducts();
                });
            });

            checkoutBtn.addEventListener('click', checkout);
        }

        // Agregar al carrito
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCartToStorage();
            updateCartCount();
            showAddedNotification();
        }

        // Mostrar notificación
        function showAddedNotification() {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✓ Añadido';
            btn.style.background = '#51cf66';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 1500);
        }

        // Actualizar cantidad de artículos en el carrito
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // Abrir carrito
        function openCart() {
            renderCart();
            cartModal.classList.add('active');
        }

        // Cerrar carrito
        function closeCart() {
            cartModal.classList.remove('active');
        }

        // Renderizar carrito
        function renderCart() {
            const cartItemsDiv = document.getElementById('cartItems');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-cart">Tu carrito está vacío 😢</div>';
                checkoutBtn.disabled = true;
                updateCartTotals();
                return;
            }

            checkoutBtn.disabled = false;

            cartItemsDiv.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.emoji} ${item.name}</div>
                        <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                        <div class="cart-item-quantity">
                            <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">Eliminar</button>
                </div>
            `).join('');

            updateCartTotals();
        }

        // Actualizar cantidad
        function updateQuantity(index, change) {
            const newQuantity = cart[index].quantity + change;
            if (newQuantity > 0) {
                cart[index].quantity = newQuantity;
            } else {
                removeFromCart(index);
            }
            saveCartToStorage();
            updateCartCount();
            renderCart();
        }

        // Eliminar del carrito
        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCartToStorage();
            updateCartCount();
            renderCart();
        }

        // Actualizar totales
        function updateCartTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = cart.length > 0 ? 5.00 : 0;
            const total = subtotal + shipping;

            document.getElementById('subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('shipping').textContent = `$${shipping.toFixed(2)}`;
            document.getElementById('total').textContent = `$${total.toFixed(2)}`;
        }

        // Finalizar compra
        function checkout() {
            if (cart.length === 0) return;

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0) + 5.00;
            const items = cart.map(item => `${item.quantity}x ${item.name}`).join(', ');

            alert(`¡Gracias por tu compra!\n\nProductos: ${items}\n\nTotal: $${total.toFixed(2)}\n\nEste es un carrito de demostración.`);
            
            cart = [];
            saveCartToStorage();
            updateCartCount();
            closeCart();
            renderCart();
        }

        // Guardar carrito en localStorage
        function saveCartToStorage() {
            localStorage.setItem('pajarracoCart', JSON.stringify(cart));
        }

        // Cargar carrito de localStorage
        function loadCartFromStorage() {
            const savedCart = localStorage.getItem('pajarracoCart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
        }

        // Iniciar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
