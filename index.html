<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PajarraCO - Tienda de Stickers</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" class="logo">
                <img src="logos.png" alt="Logo Pajarraco" class="logo-img">
                PajarraCO
            </a>
            <div class="nav-right">
                <a href="https://www.instagram.com/pajarra_co" target="_blank" rel="noopener noreferrer" class="instagram-btn" aria-label="Instagram @pajarra_co" title="Instagram @pajarra_co">
                    <!-- Instagram SVG icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                        <path d="M7 2C4.243 2 2 4.243 2 7v10c0 2.757 2.243 5 5 5h10c2.757 0 5-2.243 5-5V7c0-2.757-2.243-5-5-5H7zm0 2h10c1.654 0 3 1.346 3 3v10c0 1.654-1.346 3-3 3H7c-1.654 0-3-1.346-3-3V7c0-1.654 1.346-3 3-3zm5 3.5A4.5 4.5 0 1 0 16.5 12 4.505 4.505 0 0 0 12 7.5zm0 2A2.5 2.5 0 1 1 14.5 12 2.503 2.503 0 0 1 12 9.5zM18.5 6a.9.9 0 1 1-.9.9.9.9 0 0 1 .9-.9z"/>
                    </svg>
                </a>
                <select id="currencySelect" class="currency-selector">
                    <option value="clp">CLP</option>
                    <option value="usd">USD</option>
                </select>
                <div class="cart-icon" id="cartIcon">
                    🛒
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Bienvenido a Pajarraco</h1>
            <p>La tienda de stickers más colorida y divertida </p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="aves">Aves divertidas</button>
            <button class="filter-btn" data-filter="ilustraciones">Ilustraciones</button>
            <button class="filter-btn" data-filter="kit">Kit de supervivencia</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargarán aquí con JavaScript -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PajarraCO - Tienda de Stickers. Todos los derechos reservados. Cony y Robert. </p>
    </footer>

    <!-- Modal del Carrito -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Carrito</h2>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div id="cartItems"></div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0</span>
                </div>
                <div class="summary-row">
                    <span>Envío:</span>
                    <span id="shipping">$0</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0</span>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Finalizar Compra</button>
        </div>
    </div>

    <script>
        // Tasas de conversión (ejemplo - actualizar según sea necesario)
        const exchangeRate = {
            clp: 1,      // Base
            usd: 0.0012  // 1 CLP ≈ 0.0012 USD
        };

        // Base de datos de productos
        const products = [
            { 
                id: 1, 
                name: 'Sticker Zorro', 
                category: 'ilustraciones', 
                price: 500, 
                image: 'zorro.png'
            },
            { 
                id: 2, 
                name: 'Sticker tocó apechugar', 
                category: 'aves', 
                price: 500, 
                image: 'apechugar.png'
            },
            { 
                id: 3, 
                name: 'Sticker Pajarón', 
                category: 'aves', 
                price: 500, 
                image: 'pajaron.png'
            },
            { 
                id: 4, 
                name: 'Sticker Tortugas', 
                category: 'ilustraciones', 
                price: 500, 
                image: 'tortugas.png'
            },
            { 
                id: 5, 
                name: 'Sticker Patidifuso', 
                category: 'aves', 
                price: 500, 
                image: 'patidifuso.png'
            },
            { 
                id: 6, 
                name: 'Sticker Patuo', 
                category: 'aves', 
                price: 500, 
                image: 'patuo.png'
            },
            { 
                id: 7, 
                name: 'Sticker Dando pelea', 
                category: 'kit', 
                price: 500, 
                image: 'dando pelea.png'
            },
            { 
                id: 8, 
                name: 'Sticker imcuaktado', 
                category: 'aves', 
                price: 500, 
                image: 'imcuaktado.png'
            },
            { 
                id: 9, 
                name: 'Sticker Mi Animal Espiritual', 
                category: 'kit', 
                price: 500, 
                image: 'animalespiritual.png'
            },
            { 
                id: 10, 
                name: 'Sticker Diuca', 
                category: 'aves', 
                price: 500, 
                images: 'diuca.png'
            },
            { 
                id: 11, 
                name: 'Sticker Zorro', 
                category: 'ilustraciones', 
                price: 500, 
                image: 'zorro2.png'
            },
            { 
                id: 12, 
                name: 'Sticker Llama', 
                category: 'ilustraciones', 
                price: 500, 
                image: 'llama.png'
            },
            { 
                id: 13, 
                name: 'Sticker Martín Pescador', 
                category: 'ilustraciones', 
                price: 500, 
                image: 'martin.png'
            }
        ];

        let cart = [];
        let currentFilter = 'all';
        let currentCurrency = 'clp';

        // Elementos del DOM
        const productsGrid = document.getElementById('productsGrid');
        const cartIcon = document.getElementById('cartIcon');
        const cartModal = document.getElementById('cartModal');
        const closeCartBtn = document.getElementById('closeCart');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const currencySelect = document.getElementById('currencySelect');

        // Inicializar la página
        function init() {
            renderProducts();
            setupEventListeners();
            loadCartFromStorage();
            loadCurrencyFromStorage();
            updateCartCount();
        }

        // Función para obtener el símbolo de moneda
        function getCurrencySymbol() {
            return currentCurrency === 'usd' ? 'US$' : '$';
        }

        // Función para convertir precios
        function convertPrice(price) {
            return Math.round(price * exchangeRate[currentCurrency]);
        }

        // Función para formatear precios con o sin decimales según la moneda
        function formatPrice(price) {
            const converted = convertPrice(price);
            if (currentCurrency === 'clp') {
                return converted.toString();
            } else {
                return converted.toFixed(2);
            }
        }

        // Renderizar productos
        function renderProducts() {
            const filteredProducts = currentFilter === 'all' 
                ? products 
                : products.filter(p => p.category === currentFilter);

            productsGrid.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-description">Diseño exclusivo</div>
                        <div class="product-footer">
                            <span class="price">${getCurrencySymbol()}${formatPrice(product.price)}</span>
                            <button class="add-to-cart-btn" onclick="addToCart(${product.id})">Añadir</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Configurar event listeners
        function setupEventListeners() {
            cartIcon.addEventListener('click', openCart);
            closeCartBtn.addEventListener('click', closeCart);
            cartModal.addEventListener('click', (e) => {
                if (e.target === cartModal) closeCart();
            });

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderProducts();
                });
            });

            currencySelect.addEventListener('change', (e) => {
                currentCurrency = e.target.value;
                saveCurrencyToStorage();
                renderProducts();
                if (cart.length > 0) {
                    updateCartTotals();
                }
            });

            checkoutBtn.addEventListener('click', checkout);
        }

        // Agregar al carrito
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCartToStorage();
            updateCartCount();
            showAddedNotification();
        }

        // Mostrar notificación
        function showAddedNotification() {
            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '✓ Añadido';
            btn.style.background = '#51cf66';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
            }, 1500);
        }

        // Actualizar cantidad de artículos en el carrito
        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = count;
        }

        // Abrir carrito
        function openCart() {
            renderCart();
            cartModal.classList.add('active');
        }

        // Cerrar carrito
        function closeCart() {
            cartModal.classList.remove('active');
        }

        // Renderizar carrito
        function renderCart() {
            const cartItemsDiv = document.getElementById('cartItems');

            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div class="empty-cart">Tu carrito está vacío 😢</div>';
                checkoutBtn.disabled = true;
                updateCartTotals();
                return;
            }

            checkoutBtn.disabled = false;

            cartItemsDiv.innerHTML = cart.map((item, index) => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.emoji} ${item.name}</div>
                        <div class="cart-item-price">${getCurrencySymbol()}${formatPrice(item.price)}</div>
                        <div class="cart-item-quantity">
                            <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                        </div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">Eliminar</button>
                </div>
            `).join('');

            updateCartTotals();
        }

        // Actualizar cantidad
        function updateQuantity(index, change) {
            const newQuantity = cart[index].quantity + change;
            if (newQuantity > 0) {
                cart[index].quantity = newQuantity;
            } else {
                removeFromCart(index);
            }
            saveCartToStorage();
            updateCartCount();
            renderCart();
        }

        // Eliminar del carrito
        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCartToStorage();
            updateCartCount();
            renderCart();
        }

        // Actualizar totales
        function updateCartTotals() {
            const subtotal = cart.reduce((sum, item) => sum + (convertPrice(item.price) * item.quantity), 0);
            const shipping = cart.length > 0 ? convertPrice(500) : 0;
            const total = subtotal + shipping;

            if (currentCurrency === 'clp') {
                document.getElementById('subtotal').textContent = `${getCurrencySymbol()}${subtotal}`;
                document.getElementById('shipping').textContent = `${getCurrencySymbol()}${shipping}`;
                document.getElementById('total').textContent = `${getCurrencySymbol()}${total}`;
            } else {
                document.getElementById('subtotal').textContent = `${getCurrencySymbol()}${subtotal.toFixed(2)}`;
                document.getElementById('shipping').textContent = `${getCurrencySymbol()}${shipping.toFixed(2)}`;
                document.getElementById('total').textContent = `${getCurrencySymbol()}${total.toFixed(2)}`;
            }
        }

        // Finalizar compra
        function checkout() {
            if (cart.length === 0) return;

            const subtotal = cart.reduce((sum, item) => sum + (convertPrice(item.price) * item.quantity), 0);
            const total = subtotal + convertPrice(500);
            const items = cart.map(item => `${item.quantity}x ${item.name}`).join(', ');

            let totalText = currentCurrency === 'clp' ? total : total.toFixed(2);
            alert(`¡Gracias por tu compra!\n\nProductos: ${items}\n\nTotal: ${getCurrencySymbol()}${totalText}\n\nEste es un carrito de demostración.`);
            
            cart = [];
            saveCartToStorage();
            updateCartCount();
            closeCart();
            renderCart();
        }

        // Guardar carrito en localStorage
        function saveCartToStorage() {
            localStorage.setItem('pajarracoCart', JSON.stringify(cart));
        }

        // Cargar carrito de localStorage
        function loadCartFromStorage() {
            const savedCart = localStorage.getItem('pajarracoCart');
            if (savedCart) {
                cart = JSON.parse(savedCart);
            }
        }

        // Guardar moneda en localStorage
        function saveCurrencyToStorage() {
            localStorage.setItem('pajarracoCurrency', currentCurrency);
        }

        // Cargar moneda de localStorage
        function loadCurrencyFromStorage() {
            const savedCurrency = localStorage.getItem('pajarracoCurrency');
            if (savedCurrency) {
                currentCurrency = savedCurrency;
                currencySelect.value = savedCurrency;
            }
        }

        // Iniciar cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
