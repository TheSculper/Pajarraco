<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PajarraCO - Tienda de Stickers (USD)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="#" class="logo">
                <img src="logos.png" alt="Logo Pajarraco" class="logo-img">
                PajarraCO
            </a>
            <div class="currency-nav">
                <span class="currency-label">USD 🇺🇸</span>
                <a href="index-clp.html" class="currency-link">CLP 🇨🇱</a>
            </div>
            <div class="cart-icon" id="cartIcon">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </div>
        </nav>
    </header>

    <main>
        <div class="hero">
            <h1>Bienvenido a Pajarraco</h1>
            <p>La tienda de stickers más colorida y divertida 🎨</p>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">Todos</button>
            <button class="filter-btn" data-filter="animales">Animales</button>
            <button class="filter-btn" data-filter="viajes">Viajes</button>
            <button class="filter-btn" data-filter="tech">Tech</button>
            <button class="filter-btn" data-filter="comida">Comida</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargarán aquí con JavaScript -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 PajarraCO - Tienda de Stickers. Todos los derechos reservados. Cony y Robert</p>
    </footer>

    <!-- Modal del Carrito -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Carrito</h2>
                <button class="close-btn" id="closeCart">&times;</button>
            </div>
            <div id="cartItems"></div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Envío:</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
            </div>
            <button class="checkout-btn" id="checkoutBtn">Finalizar Compra</button>
        </div>
    </div>
